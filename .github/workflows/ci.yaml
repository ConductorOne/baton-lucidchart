name: ci
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: go tests
        run: go test -v -covermode=count -json ./... > test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      CONNECTOR_GRANT: 'grant:entitlement:group:1234:member:user:9876'
      CONNECTOR_ENTITLEMENT: 'entitlement:group:1234:member'
      CONNECTOR_PRINCIPAL: 'user:9876'
      CONNECTOR_PRINCIPAL_TYPE: 'user'
      BATON_LUCID_API_KEY:        ${{ secrets.LUCID_API_KEY }}
      BATON_LUCID_CLIENT_ID:      ${{ secrets.LUCID_CLIENT_ID }}
      BATON_LUCID_CLIENT_SECRET:  ${{ secrets.LUCID_CLIENT_SECRET }}
      BATON_LUCID_REFRESH_TOKEN:  ${{ secrets.LUCID_REFRESH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: Build baton-lucidchart
        run: go build ./cmd/baton-lucidchart
      - name: Run baton-lucidchart (exclude shortcuts)
        run: ./baton-lucidchart --exclude-shortcuts
      - name: Install baton
        run: ./scripts/get-baton.sh && mv baton /usr/local/bin
