name: ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      # Add any environment variables needed to run baton-lucidchart
      # BATON_BASE_URL: 'http://localhost:8080'
      # BATON_ACCESS_TOKEN: 'secret_token'
      # The following parameters are passed to grant/revoke commands
      # Change these to the correct IDs for your test data
      CONNECTOR_GRANT: 'grant:entitlement:group:1234:member:user:9876'
      CONNECTOR_ENTITLEMENT: 'entitlement:group:1234:member'
      CONNECTOR_PRINCIPAL: 'user:9876'
      CONNECTOR_PRINCIPAL_TYPE: 'user'
      BATON_LUCID_API_KEY: ${{ secrets.LUCID_API_KEY }}
      BATON_LUCID_CLIENT_ID: ${{ secrets.LUCID_CLIENT_ID }}
      BATON_LUCID_CLIENT_SECRET: ${{ secrets.LUCID_CLIENT_SECRET }}
      BATON_LUCID_REFRESH_TOKEN: ${{ secrets.LUCID_REFRESH_TOKEN }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build baton-lucidchart
        run: go build ./cmd/baton-lucidchart
      - name: Run baton-lucidchart (exclude shortcuts)
        run: ./baton-lucidchart --exclude-shortcuts
      - name: Install baton
        run: ./scripts/get-baton.sh && mv baton /usr/local/bin
